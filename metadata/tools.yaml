version: "1.0"
description: >
  This YAML file contains metadata for tools available in the AskVerse Mini application, including their names, descriptions, and examples of usage.
tools:
  - name: arxiv
    description: >
      Use Arxiv Search when you need access to the latest scientific papers, preprints, or research articles, especially in fields like physics, mathematics, computer science, and related disciplines. Ideal for finding peer-reviewed or cutting-edge academic content.
    priority: 1
    examples:
      - What are the latest advancements in quantum computing according to recent arXiv papers?
      - Can you find preprints on machine learning algorithms published in the last month?
  - name: wiki
    description: >
      Use Wikipedia when you need general knowledge, summaries, or overviews on a wide range of topics. Suitable for quick facts, historical context, and introductory information.
    priority: 2
    examples:
      - What is the history of the Eiffel Tower?
      - Can you summarize the main theories of evolution?
  - name: tavily
    description: >
      Use Tavily when you require up-to-date web search results, news, or information from a broad set of online sources. Best for current events, trending topics, or information not covered in academic papers or encyclopedias.
    priority: 3
    examples:
      - What is the stock price of Kotak bank?
      - Can you provide the latest news on Indian politics?
      - Who won IPL 2025?
  - name: docs
    description: >
      Use docs when you require detailed information from specific documents/reports whose metadata is given in the metadata attribute below.
    priority: 0
    examples:
      - Which offences are punishable under the Indian Penal Code for children below the age of 7?
      - What is Google's effrot on environmental sustainability?
      - What is Microsoft's effrot on water stewardship?
    metadata:
      - title: Microsoft 2023 Environmental Sustainability Report
        year: 2023
        document_type: report
        company: Google
        category: environmental
        description: Google's 2023 Environmental Report detailing the company's environmental impact, sustainability initiatives, and progress towards carbon neutrality and other environmental goals.
        language: en
        visibility: public
        author: Google
        factual_score: 0.95
        sentiment_score: 0.85
        geographic_scope: global
        keywords: neutrality, net zero emissions, water stewardship, zero waste to landfill
      - title: THE INDIAN PENAL CODE
        year: 2023
        document_type: Laws
        company: Govt of India
        category: Laws
        description: Indian Penal codes
        language: en
        visibility: public
        author: IPC
        factual_score: 0.95
        sentiment_score: 0.85
        geographic_scope: India
        keywords: Penalty, crime, punishment, offenses
      - title: Microsoft 2024 Environmental Sustainability Report
        year: 2024
        document_type: report
        company: Microsoft
        category: environmental
        description: Microsoft's 2024 Environmental Sustainability Report detailing the company's environmental impact, sustainability initiatives, and progress towards carbon neutrality and other environmental goals.
        language: en
        visibility: public
        author: Microsoft
        factual_score: 0.95
        sentiment_score: 0.85
        geographic_scope: global
        keywords: neutrality, net zero emissions, water stewardship, zero waste to landfill