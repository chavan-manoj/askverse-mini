- example_query: "How is the weather in Bengaluru?"
  example_response:
    - sequence: 1
      type: api
      action:
        server: "https://weatherapi-com.p.rapidapi.com"
        method: "GET"
        url: "/forecast.json?q=Bengaluru&days={days}"
        payload: null
        missing_params:
          - name: days
            description: "Number of days for the forecast (1-10)"

